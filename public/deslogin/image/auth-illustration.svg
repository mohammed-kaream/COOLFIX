<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffefb3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffefb3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#glow)"/>

  <!-- abstract rings -->
  <circle cx="320" cy="320" r="230" fill="none" stroke="#ffefb3" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="320" cy="320" r="170" fill="none" stroke="#ffefb3" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- floating dots -->
  <circle cx="120" cy="150" r="4" fill="#ffefb3" fill-opacity="0.6"/>
  <circle cx="530" cy="200" r="5" fill="#ffefb3" fill-opacity="0.5"/>
  <circle cx="500" cy="470" r="4" fill="#ffefb3" fill-opacity="0.6"/>
  <circle cx="130" cy="480" r="3" fill="#ffefb3" fill-opacity="0.5"/>

  <!-- central fridge glyph, glassmorphism-style card -->
  <g transform="translate(220,150)">
    <rect x="-20" y="-20" width="240" height="360" rx="32" fill="#ffefb3" fill-opacity="0.06"/>
    <rect x="0" y="0" width="200" height="320" rx="28" fill="#ffefb3" fill-opacity="0.12" stroke="#ffefb3" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="0" y1="118" x2="200" y2="118" stroke="#ffefb3" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="24" y="34" width="8" height="50" rx="4" fill="#ffefb3" fill-opacity="0.8"/>
    <rect x="24" y="150" width="8" height="70" rx="4" fill="#ffefb3" fill-opacity="0.8"/>
    <!-- shelves -->
    <line x1="24" y1="170" x2="176" y2="170" stroke="#ffefb3" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="24" y1="215" x2="176" y2="215" stroke="#ffefb3" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="24" y1="260" x2="176" y2="260" stroke="#ffefb3" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- circuit accents (board repair nod) -->
  <g stroke="#ffefb3" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M470 120 h60 v40 h-30"/>
    <circle cx="530" cy="120" r="4" fill="#ffefb3" fill-opacity="0.7" stroke="none"/>
    <circle cx="500" cy="160" r="4" fill="#ffefb3" fill-opacity="0.7" stroke="none"/>
    <path d="M90 380 h50 v50 h40"/>
    <circle cx="90" cy="380" r="4" fill="#ffefb3" fill-opacity="0.7" stroke="none"/>
    <circle cx="180" cy="430" r="4" fill="#ffefb3" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- checkmark badge -->
  <g transform="translate(430,400)">
    <circle cx="0" cy="0" r="34" fill="#ffefb3"/>
    <path d="M-14 0 l10 10 l20 -22" fill="none" stroke="#013e37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
