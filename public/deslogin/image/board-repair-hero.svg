<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <circle cx="320" cy="320" r="280" fill="#ffefb3"/>
  <ellipse cx="320" cy="560" rx="220" ry="22" fill="#013e37" fill-opacity="0.08"/>

  <!-- circuit board -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="340" height="230" rx="14" fill="#013e37"/>
    <g stroke="#ffefb3" stroke-width="3" fill="none" opacity="0.55">
      <path d="M20 20 h80 v40 h60"/>
      <path d="M20 60 h40 v90"/>
      <path d="M300 20 v60 h-50 v50"/>
      <path d="M300 200 h-90 v-40"/>
      <path d="M60 200 v-50 h60"/>
    </g>
    <circle cx="20" cy="20" r="5" fill="#ffefb3"/>
    <circle cx="100" cy="20" r="5" fill="#ffefb3"/>
    <circle cx="160" cy="60" r="5" fill="#ffefb3"/>
    <circle cx="60" cy="150" r="5" fill="#ffefb3"/>
    <circle cx="300" cy="20" r="5" fill="#ffefb3"/>
    <circle cx="250" cy="80" r="5" fill="#ffefb3"/>
    <circle cx="250" cy="130" r="5" fill="#ffefb3"/>
    <circle cx="120" cy="200" r="5" fill="#ffefb3"/>
    <!-- chip -->
    <rect x="140" y="90" width="60" height="60" rx="6" fill="#ffefb3"/>
    <rect x="150" y="100" width="40" height="40" rx="4" fill="#013e37"/>
  </g>

  <!-- soldering iron with spark -->
  <g transform="translate(430,260) rotate(35)">
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#013e37"/>
    <rect x="120" y="2" width="34" height="12" rx="4" fill="#ffefb3" stroke="#013e37" stroke-width="3"/>
    <polygon points="0,8 -22,3 -22,13" fill="#013e37"/>
  </g>
  <g stroke="#013e37" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="270" x2="392" y2="258"/>
    <line x1="404" y1="282" x2="392" y2="282"/>
    <line x1="400" y1="294" x2="392" y2="304"/>
  </g>

  <!-- technician -->
  <g transform="translate(60,300)">
    <rect x="30" y="180" width="18" height="80" rx="8" fill="#013e37"/>
    <rect x="62" y="180" width="18" height="80" rx="8" fill="#013e37"/>
    <rect x="18" y="90" width="76" height="100" rx="16" fill="#ffffff" stroke="#013e37" stroke-width="6"/>
    <rect x="-4" y="98" width="24" height="72" rx="12" fill="#ffffff" stroke="#013e37" stroke-width="6" transform="rotate(8 -4 98)"/>
    <rect x="92" y="90" width="24" height="70" rx="12" fill="#ffffff" stroke="#013e37" stroke-width="6" transform="rotate(-35 92 90)"/>
    <circle cx="56" cy="55" r="32" fill="#f4c9a1"/>
    <path d="M22 48 a34 27 0 0 1 68 0 z" fill="#013e37"/>
    <rect x="18" y="44" width="76" height="11" rx="5" fill="#013e37"/>
    <!-- glasses -->
    <circle cx="44" cy="58" r="8" fill="none" stroke="#013e37" stroke-width="3"/>
    <circle cx="68" cy="58" r="8" fill="none" stroke="#013e37" stroke-width="3"/>
    <line x1="52" y1="58" x2="60" y2="58" stroke="#013e37" stroke-width="3"/>
  </g>
</svg>
