<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="600" rx="24" fill="#fff8e6"/>

  <!-- floor -->
  <ellipse cx="300" cy="520" rx="230" ry="22" fill="#013e37" fill-opacity="0.08"/>

  <!-- Toolbox -->
  <g transform="translate(70,420)">
    <rect x="0" y="20" width="110" height="60" rx="8" fill="#013e37"/>
    <rect x="0" y="20" width="110" height="14" fill="#ffefb3"/>
    <path d="M35 20 v-18 a5 5 0 0 1 5 -5 h30 a5 5 0 0 1 5 5 v18" fill="none" stroke="#013e37" stroke-width="7"/>
  </g>

  <!-- Refrigerator (front view, open door) -->
  <g transform="translate(230,90)">
    <rect x="0" y="0" width="230" height="430" rx="16" fill="#ffffff" stroke="#013e37" stroke-width="6"/>
    <line x1="0" y1="150" x2="230" y2="150" stroke="#013e37" stroke-width="6"/>
    <rect x="205" y="30" width="10" height="70" rx="5" fill="#013e37"/>
    <rect x="205" y="170" width="10" height="120" rx="5" fill="#013e37"/>
    <line x1="20" y1="60" x2="185" y2="60" stroke="#ffefb3" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="185" y2="90" stroke="#ffefb3" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="200" x2="185" y2="200" stroke="#013e37" stroke-opacity="0.2" stroke-width="3"/>
    <line x1="20" y1="260" x2="185" y2="260" stroke="#013e37" stroke-opacity="0.2" stroke-width="3"/>
    <line x1="20" y1="320" x2="185" y2="320" stroke="#013e37" stroke-opacity="0.2" stroke-width="3"/>
    <line x1="20" y1="380" x2="185" y2="380" stroke="#013e37" stroke-opacity="0.2" stroke-width="3"/>
    <!-- some bottles -->
    <rect x="30" y="360" width="16" height="30" rx="4" fill="#ffefb3" stroke="#013e37" stroke-width="3"/>
    <rect x="55" y="355" width="16" height="35" rx="4" fill="#ffefb3" stroke="#013e37" stroke-width="3"/>
  </g>

  <!-- Technician kneeling, checking compressor at back-bottom -->
  <g transform="translate(105,300)">
    <!-- back leg -->
    <rect x="50" y="140" width="20" height="70" rx="8" fill="#013e37"/>
    <!-- front bent leg -->
    <path d="M10 210 h50 v20 h-70 a10 10 0 0 1 -8,-16 z" fill="#013e37"/>
    <!-- torso leaning forward -->
    <rect x="15" y="55" width="80" height="95" rx="16" fill="#ffefb3" stroke="#013e37" stroke-width="5" transform="rotate(12 55 100)"/>
    <!-- arm reaching to fridge -->
    <rect x="85" y="80" width="24" height="80" rx="12" fill="#ffefb3" stroke="#013e37" stroke-width="5" transform="rotate(70 85 80)"/>
    <!-- screwdriver -->
    <g transform="translate(150,95) rotate(70)">
      <rect x="0" y="0" width="45" height="8" rx="4" fill="#013e37"/>
      <rect x="45" y="-3" width="14" height="14" rx="2" fill="#ffefb3" stroke="#013e37" stroke-width="3"/>
    </g>
    <!-- head -->
    <circle cx="45" cy="40" r="32" fill="#f4c9a1"/>
    <path d="M12 34 a33 27 0 0 1 66 0 z" fill="#013e37"/>
    <rect x="9" y="30" width="72" height="11" rx="5" fill="#013e37"/>
  </g>

  <!-- checklist / clipboard floating -->
  <g transform="translate(420,300)">
    <rect x="0" y="0" width="90" height="110" rx="8" fill="#ffffff" stroke="#013e37" stroke-width="5"/>
    <rect x="28" y="-8" width="34" height="16" rx="5" fill="#013e37"/>
    <line x1="16" y1="30" x2="74" y2="30" stroke="#013e37" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="52" x2="74" y2="52" stroke="#013e37" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="74" x2="55" y2="74" stroke="#013e37" stroke-width="5" stroke-linecap="round"/>
    <path d="M16 90 l8 8 l16 -16" fill="none" stroke="#013e37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
