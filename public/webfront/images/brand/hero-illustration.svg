<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <circle id="bgcircle" cx="320" cy="320" r="280"/>
  </defs>
  <use href="#bgcircle" fill="#ffefb3"/>

  <!-- floor shadow -->
  <ellipse cx="330" cy="560" rx="220" ry="24" fill="#013e37" fill-opacity="0.08"/>

  <!-- Refrigerator -->
  <g>
    <rect x="200" y="120" width="220" height="420" rx="18" fill="#ffffff" stroke="#013e37" stroke-width="6"/>
    <rect x="200" y="120" width="220" height="150" rx="18" fill="#ffffff" stroke="#013e37" stroke-width="6"/>
    <line x1="200" y1="270" x2="420" y2="270" stroke="#013e37" stroke-width="6"/>
    <!-- handles -->
    <rect x="380" y="150" width="12" height="80" rx="6" fill="#013e37"/>
    <rect x="380" y="300" width="12" height="120" rx="6" fill="#013e37"/>
    <!-- shelves lines freezer -->
    <line x1="220" y1="200" x2="365" y2="200" stroke="#ffefb3" stroke-width="8" stroke-linecap="round"/>
    <line x1="220" y1="230" x2="365" y2="230" stroke="#ffefb3" stroke-width="8" stroke-linecap="round"/>
    <!-- fridge body shelves -->
    <line x1="220" y1="330" x2="365" y2="330" stroke="#013e37" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="220" y1="400" x2="365" y2="400" stroke="#013e37" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="220" y1="470" x2="365" y2="470" stroke="#013e37" stroke-width="3" stroke-opacity="0.25"/>
    <!-- feet -->
    <rect x="215" y="536" width="16" height="14" rx="3" fill="#013e37"/>
    <rect x="389" y="536" width="16" height="14" rx="3" fill="#013e37"/>
  </g>

  <!-- open panel with gears (service/repair) -->
  <g transform="translate(430,330)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#013e37" stroke-width="5"/>
    <g fill="none" stroke="#013e37" stroke-width="5" stroke-linecap="round">
      <path d="M0 -22 a22 22 0 1 1 -15.5 6.5" />
      <polygon points="-15.5,6.5 -26,4 -20,16" fill="#013e37" stroke="none"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#013e37"/>
  </g>

  <!-- Technician figure -->
  <g transform="translate(70,260)">
    <!-- legs -->
    <rect x="30" y="220" width="18" height="90" rx="8" fill="#013e37"/>
    <rect x="62" y="220" width="18" height="90" rx="8" fill="#013e37"/>
    <!-- shoes -->
    <rect x="24" y="304" width="30" height="14" rx="7" fill="#0a0a0a" fill-opacity="0.75"/>
    <rect x="56" y="304" width="30" height="14" rx="7" fill="#0a0a0a" fill-opacity="0.75"/>
    <!-- torso (overalls) -->
    <rect x="18" y="120" width="76" height="110" rx="16" fill="#ffefb3" stroke="#013e37" stroke-width="5"/>
    <!-- chest pocket -->
    <rect x="46" y="150" width="22" height="18" rx="3" fill="none" stroke="#013e37" stroke-width="3"/>
    <!-- arms -->
    <rect x="-6" y="128" width="26" height="80" rx="12" fill="#ffefb3" stroke="#013e37" stroke-width="5"/>
    <rect x="92" y="118" width="26" height="70" rx="12" fill="#ffefb3" stroke="#013e37" stroke-width="5" transform="rotate(-25 92 118)"/>
    <!-- wrench in hand -->
    <g transform="translate(118,80) rotate(-25)">
      <rect x="0" y="0" width="55" height="12" rx="6" fill="#013e37"/>
      <circle cx="0" cy="6" r="12" fill="none" stroke="#013e37" stroke-width="7"/>
    </g>
    <!-- head -->
    <circle cx="56" cy="90" r="34" fill="#f4c9a1"/>
    <!-- cap -->
    <path d="M20 82 a36 30 0 0 1 72 0 z" fill="#013e37"/>
    <rect x="16" y="78" width="80" height="12" rx="6" fill="#013e37"/>
  </g>

  <!-- floating snowflake accents -->
  <g stroke="#013e37" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <g transform="translate(500,150)">
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-10" y1="-10" x2="10" y2="10"/>
      <line x1="-10" y1="10" x2="10" y2="-10"/>
    </g>
    <g transform="translate(120,140) scale(0.7)">
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-10" y1="-10" x2="10" y2="10"/>
      <line x1="-10" y1="10" x2="10" y2="-10"/>
    </g>
  </g>
</svg>
